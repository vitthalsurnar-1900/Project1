<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <meta name="description" content="A little reminder that every great idea starts somewhere.">
  <title>Hello, world.</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #f7f5f2;
      --muted: #aaaab7;
      --accent: #c8fb74;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 47%, rgba(107, 85, 181, .2), transparent 39rem),
        #10131d;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      opacity: .28;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    main {
      position: relative;
      width: min(100% - 3rem, 900px);
      padding: clamp(3rem, 10vw, 7.5rem) 0;
      animation: arrive 900ms cubic-bezier(.2,.75,.25,1) both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin: 0 0 2rem .35rem;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .spark {
      width: .55rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(200, 251, 116, .72);
    }

    h1 {
      margin: 0;
      font-size: clamp(4.3rem, 13.5vw, 9.6rem);
      font-weight: 620;
      letter-spacing: -.085em;
      line-height: .91;
    }

    h1 span {
      display: block;
      color: var(--accent);
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 2rem;
      margin: 3rem .35rem 0;
    }

    .note {
      max-width: 24rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(.95rem, 2vw, 1.08rem);
      line-height: 1.7;
    }

    .note strong { color: var(--ink); font-weight: 550; }

    .mark {
      flex: 0 0 auto;
      display: grid;
      width: 3rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(247, 245, 242, .18);
      border-radius: 50%;
      color: var(--accent);
      font-size: 1.2rem;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      main { width: min(100% - 2.5rem, 900px); }
      .bottom { align-items: center; margin-top: 2.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow"><span class="spark" aria-hidden="true"></span>A small beginning</p>
    <h1>Hello,<span>world.</span></h1>
    <div class="bottom">
      <p class="note"><strong>Every great idea starts somewhere.</strong><br>Here’s to the first line—and everything that comes after.</p>
      <span class="mark" aria-hidden="true">✳</span>
    </div>
  </main>
</body>
</html>
